name: Deploy Realtime to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/realtime/**'
      - 'packages/shared/**'
      - 'packages/content/**'
      - 'packages/sim/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-realtime.yml'
  workflow_dispatch:

concurrency:
  group: deploy-realtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, neomac-vps]
    env:
      PROJECT_NAME: ${{ vars.REALTIME_PROJECT_NAME || 'stick-fighter-realtime' }}
      SUBDOMAIN: ${{ vars.REALTIME_SUBDOMAIN || 'stick-fighter-realtime' }}
      API_VERSION: ${{ github.sha }}

    steps:
      - name: Sync repo to /opt/apps
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          REF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /opt/apps
          cd /opt/apps
          if [ ! -d "${PROJECT_NAME}" ]; then
            git clone "${REPO_URL}" "${PROJECT_NAME}"
          fi
          cd "${PROJECT_NAME}"
          git remote set-url origin "${REPO_URL}"
          # Pull whatever ref the workflow was triggered from (main on push,
          # or the dispatched branch via gh workflow run --ref). Using $GITHUB_SHA
          # avoids hardcoding "main" so we can deploy feature branches for testing.
          git fetch origin "${REF_SHA}"
          git reset --hard "${REF_SHA}"

      - name: Write apps/realtime/.env from secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          cd "/opt/apps/${PROJECT_NAME}/apps/realtime"
          if [ -z "${JWT_SECRET:-}" ]; then
            echo "::error::JWT_SECRET secret not set (must match apps/api so tokens validate)"
            exit 1
          fi
          cat > .env <<EOF
          PROJECT_NAME=${PROJECT_NAME}
          SUBDOMAIN=${SUBDOMAIN}
          API_VERSION=${API_VERSION}
          JWT_SECRET=${JWT_SECRET}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://stick-fighter.neomac.io}
          EOF
          chmod 600 .env

      - name: Build & start container
        run: |
          set -euo pipefail
          cd "/opt/apps/${PROJECT_NAME}/apps/realtime"
          docker compose -f docker-compose.prod.yml build --no-cache
          docker compose -f docker-compose.prod.yml up -d

      - name: Prune old images
        run: docker image prune -f

      - name: Health check
        run: |
          set -euo pipefail
          # Wait for the container to start serving /health.
          for i in $(seq 1 20); do
            if docker exec "${PROJECT_NAME}" wget -q -O- http://localhost:2567/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "container healthy"
              break
            fi
            sleep 2
          done
          # Verify via public URL — Traefik should be routing already.
          if curl -fsSL --max-time 15 "https://${SUBDOMAIN}.neomac.io/health" | grep -q '"status":"ok"'; then
            echo "public URL healthy: https://${SUBDOMAIN}.neomac.io"
          else
            echo "::warning::public healthcheck failed — Traefik may still be settling"
          fi
