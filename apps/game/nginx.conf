server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip básico (Traefik no comprime upstreams por defecto)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff2;

    # Assets con hash en el nombre (vite emite name-[hash].js): cache largo + immutable.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fonts / imágenes que Vite mete en la raíz también cacheables.
    location ~* \.(woff2?|ttf|eot|otf|png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback: cualquier ruta no-asset cae a index.html (sin cache para que
    # un deploy nuevo se note al instante).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck barato para verificación post-deploy.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
