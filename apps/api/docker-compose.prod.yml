# Production compose for stick-fighter-api on the personal VPS.
# Used by the /deploy-to-vps pipeline. Postgres + API + a one-shot migrate job.
#
# Subdomain: api.stick-fighter.neomac.io (Traefik wildcard cert *.neomac.io).
# DB stays as a Docker volume per F4 spec — backups by `docker exec pg_dump`
# from a host cron, written to /opt/backups (configured outside this file).

services:
  api:
    container_name: stick-fighter-api
    image: ghcr.io/glezrdg/stick-fighter-api:latest
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      api-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      API_VERSION: ${API_VERSION:-0.1.0}
      DATABASE_URL: postgres://stick:${POSTGRES_PASSWORD}@api-postgres:5432/stick_fighter
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - web
      - default
    mem_limit: 512m
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web'
      - 'traefik.http.routers.stick-fighter-api.rule=Host(`api.stick-fighter.neomac.io`)'
      - 'traefik.http.routers.stick-fighter-api.entrypoints=websecure'
      - 'traefik.http.routers.stick-fighter-api.tls=true'
      - 'traefik.http.routers.stick-fighter-api.tls.certresolver=cf-dns'
      - 'traefik.http.services.stick-fighter-api.loadbalancer.server.port=3000'

  api-migrate:
    container_name: stick-fighter-api-migrate
    image: ghcr.io/glezrdg/stick-fighter-api:latest
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    command: ['node', 'dist/db/migrate.js']
    working_dir: /app
    depends_on:
      api-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://stick:${POSTGRES_PASSWORD}@api-postgres:5432/stick_fighter
    networks:
      - default

  api-postgres:
    container_name: stick-fighter-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stick_fighter
    volumes:
      - stick-fighter-pgdata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stick -d stick_fighter']
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m

networks:
  web:
    external: true
  default:
    driver: bridge

volumes:
  stick-fighter-pgdata:
    name: stick-fighter-pgdata
