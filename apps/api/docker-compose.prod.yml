# Production compose para stick-fighter-api en el VPS personal.
# Usado por el workflow .github/workflows/deploy-api.yml.
#
# Subdomain: stick-fighter-api.neomac.io (cert wildcard *.neomac.io via cf-dns).
# DB stays as a Docker volume — backup vía pg_dump cron del host (out of scope here).

services:
  api:
    container_name: ${PROJECT_NAME:-stick-fighter-api}
    image: ${PROJECT_NAME:-stick-fighter-api}:latest
    build:
      # context apunta al monorepo root (..). Dockerfile vive en apps/api/.
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      api-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      API_VERSION: ${API_VERSION:-0.1.0}
      DATABASE_URL: postgres://stick:${POSTGRES_PASSWORD}@api-postgres:5432/stick_fighter
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - web
      - default
    mem_limit: 512m
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web'
      - 'traefik.http.routers.${PROJECT_NAME:-stick-fighter-api}.rule=Host(`${SUBDOMAIN:-stick-fighter-api}.neomac.io`)'
      - 'traefik.http.routers.${PROJECT_NAME:-stick-fighter-api}.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT_NAME:-stick-fighter-api}.tls=true'
      - 'traefik.http.routers.${PROJECT_NAME:-stick-fighter-api}.tls.certresolver=cf-dns'
      - 'traefik.http.services.${PROJECT_NAME:-stick-fighter-api}.loadbalancer.server.port=3000'
      # HTTP→HTTPS redirect
      - 'traefik.http.routers.${PROJECT_NAME:-stick-fighter-api}-http.rule=Host(`${SUBDOMAIN:-stick-fighter-api}.neomac.io`)'
      - 'traefik.http.routers.${PROJECT_NAME:-stick-fighter-api}-http.entrypoints=web'
      - 'traefik.http.routers.${PROJECT_NAME:-stick-fighter-api}-http.middlewares=${PROJECT_NAME:-stick-fighter-api}-https'
      - 'traefik.http.middlewares.${PROJECT_NAME:-stick-fighter-api}-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.${PROJECT_NAME:-stick-fighter-api}-https.redirectscheme.permanent=true'

  api-migrate:
    container_name: ${PROJECT_NAME:-stick-fighter-api}-migrate
    image: ${PROJECT_NAME:-stick-fighter-api}:latest
    restart: 'no'
    command: ['node', 'dist/db/migrate.js']
    working_dir: /app
    depends_on:
      api-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://stick:${POSTGRES_PASSWORD}@api-postgres:5432/stick_fighter
    networks:
      - default

  api-postgres:
    container_name: ${PROJECT_NAME:-stick-fighter-api}-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stick_fighter
    volumes:
      - stick-fighter-pgdata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stick -d stick_fighter']
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m

networks:
  web:
    external: true
  default:
    driver: bridge

volumes:
  stick-fighter-pgdata:
    name: stick-fighter-pgdata
